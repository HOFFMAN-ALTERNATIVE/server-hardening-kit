# Example static site behind a reverse proxy.
# Replace YOUR_DOMAIN and YOUR_UPSTREAM_*.

limit_req_zone $binary_remote_addr zone=general:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=api:10m rate=2r/s;
limit_conn_zone $binary_remote_addr zone=addr:10m;

# Prefer real client IP when sitting behind Cloudflare (see cloudflare-ips.example.conf)
# include /etc/nginx/cloudflare-ips.conf;
# real_ip_header CF-Connecting-IP;

server {
    listen 8080;
    server_name YOUR_DOMAIN www.YOUR_DOMAIN;

    root /var/www/site;
    index index.html;

    client_max_body_size 1m;
    limit_conn addr 20;
    limit_req zone=general burst=20 nodelay;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        limit_req zone=api burst=5 nodelay;
        limit_conn addr 4;
        proxy_pass http://127.0.0.1:YOUR_UPSTREAM_PORT;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }
}
