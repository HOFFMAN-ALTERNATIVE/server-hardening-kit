# Drop this file next to nginx and `include` it, then refresh periodically
# with scripts/update-cloudflare-ips.sh (replace the URL fetch with current
# Cloudflare published ranges: https://www.cloudflare.com/ips/).

# IPv4 (examples — refresh from Cloudflare's official lists)
# set_real_ip_from 173.245.48.0/20;
# set_real_ip_from 103.21.244.0/22;
# ...

# IPv6
# set_real_ip_from 2400:cb00::/32;
# ...

real_ip_header CF-Connecting-IP;
real_ip_recursive on;
